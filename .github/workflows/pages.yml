name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static atlas
        run: |
          node --check site/app.js
          node --test site/tests/app.test.mjs
          python -m json.tool site/data/sources.json >/dev/null
          python -m json.tool site/data/approved.json >/dev/null
      - name: Verify private reviewer using synthetic fixtures
        run: |
          python -m pip install -r review/requirements.txt
          python -m unittest discover -s review/tests -v
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4