name: Deploy research atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage independent published workbooks
        run: |
          test -f RDMO_about_coding_review.xlsx
          test -f governance.xlsx
          mkdir -p site/data site/vendor
          cp RDMO_about_coding_review.xlsx site/data/language.xlsx
          cp governance.xlsx site/data/governance.xlsx
          curl -fsSL --retry 3 -m 45 https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js -o site/vendor/xlsx.full.min.js
          printf '%s\n' 'cc015130aa8521e7f088f88898eba949ccdcbfb38df0bd129b44b7273c3a6f41  site/vendor/xlsx.full.min.js' | sha256sum -c -
      - name: Verify governed workbook and prototype
        run: |
          python -m pip install 'openpyxl>=3.1.5,<4'
          python - <<'PY'
          import openpyxl
          book = openpyxl.load_workbook('governance.xlsx', read_only=True, data_only=True)
          assert book.sheetnames == ['README', 'Board', 'Sources']
          board = ['record_id', 'organization', 'record_date', 'member_name', 'role', 'affiliation', 'sector', 'source_id', 'source_url', 'verification_status', 'notes']
          sources = ['source_id', 'organization', 'title', 'document_date', 'capture_date', 'source_url', 'publisher', 'verification_status', 'notes']
          assert [c.value for c in next(book['Board'].rows)][:len(board)] == board
          assert [c.value for c in next(book['Sources'].rows)][:len(sources)] == sources
          book.close()
          PY
          python - <<'PYCODE'
          from openpyxl import load_workbook
          book=load_workbook('RDMO_about_coding_review.xlsx',read_only=True,data_only=True)
          assert 'Index' in book.sheetnames and 'Source Inventory' in book.sheetnames
          index=list(book['Index'].values)
          header=index[1]
          assert {'source_id','worksheet','capture_timestamp','source_verification_status','source_text_sha256'}.issubset(header)
          assert len(index)-2 >= 36
          total=0
          required={'block_id','source_id','source_order','block_kind','paragraph_id','original_text','corrected_text','source_review_status','process_type','process','participants','voice','institutional_priority','represented_beneficiary'}
          for sheet in [book[name] for name in book.sheetnames if name.startswith('SRC_')]:
              columns={cell.value for cell in next(sheet.rows)}
              assert required.issubset(columns),sheet.title
              total+=sheet.max_row-1
          assert total>=271,total
          book.close()
          PYCODE
          cmp RDMO_about_coding_review.xlsx site/data/language.xlsx
          for file in site/app.js site/reading-layout.js site/language-table.js site/refinements.js site/canonical-workflow.js; do node --check "$file"; done
          node --test site/tests/*.mjs
          if grep -R -qi --exclude='ai-disclosure.md' 'lorem ipsum' site/content; then echo 'Unexpected placeholder found'; exit 1; fi
          grep -qi 'Editorial placeholder' site/content/ai-disclosure.md
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for uploaded Pages artifact to become discoverable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [[ "$count" == "1" ]]; then
              sleep 6
              exit 0
            fi
            if [[ "$count" != "0" ]]; then
              echo "Expected exactly one github-pages artifact; found $count" >&2
              exit 1
            fi
            sleep 2
          done
          echo 'The github-pages artifact was not indexed within one minute' >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
