name: Deploy research atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage independent published workbooks
        run: |
          test -f RDMO_about_coding_review.xlsx
          test -f governance.xlsx
          mkdir -p site/data site/vendor
          cp RDMO_about_coding_review.xlsx site/data/language.xlsx
          cp governance.xlsx site/data/governance.xlsx
          curl -fsSL --retry 3 -m 45 https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js -o site/vendor/xlsx.full.min.js
          printf '%s\n' 'cc015130aa8521e7f088f88898eba949ccdcbfb38df0bd129b44b7273c3a6f41  site/vendor/xlsx.full.min.js' | sha256sum -c -
      - name: Verify governed workbook and prototype
        run: |
          python -m pip install 'openpyxl>=3.1.5,<4'
          python - <<'PY'
          import openpyxl
          book = openpyxl.load_workbook('governance.xlsx', read_only=True, data_only=True)
          assert book.sheetnames == ['README', 'Board', 'Sources']
          board = ['record_id', 'organization', 'record_date', 'member_name', 'role', 'affiliation', 'sector', 'source_id', 'source_url', 'verification_status', 'notes']
          sources = ['source_id', 'organization', 'title', 'document_date', 'capture_date', 'source_url', 'publisher', 'verification_status', 'notes']
          assert [c.value for c in next(book['Board'].rows)][:len(board)] == board
          assert [c.value for c in next(book['Sources'].rows)][:len(sources)] == sources
          book.close()
          PY
          node --check site/app.js
          node --test site/tests/*.mjs
          if grep -R -qi 'lorem ipsum' site/content; then echo 'Placeholder text found'; exit 1; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
